# 设备 B：双 Piper、双 Aerohand、双腕相机及全景相机。
network:
  data_port: 17860
  max_packet_bytes: 65507
rates:
  control_hz: 100
  state_hz: 100
  camera_hz: 30
  frame_hz: 30
alignment:
  max_lag_ms: 80
  teleop_timeout_ms: 150
  buffer_capacity: 512
runtime:
  # 固定使用 spawn，避免 Linux fork 继承 CAN、串口、USB 和 UDP 的内部状态。
  process_model: "spawn"
  # IPC 只传递遥操作、机器人状态和动作等小对象，绝不传图像。
  ipc_queue_capacity: 2048
  status_queue_capacity: 128
  shutdown_timeout_s: 8
  writer_shutdown_timeout_s: 60
episode:
  # 默认不录制；在 robot_main 终端输入 start 后才开始一个 episode。
  interactive: true
  auto_start: false
  min_frames: 10
  save_on_shutdown: true
  command_queue_capacity: 32
  # start 激活三路同级相机服务；idle 时服务进程存在但不会打开或采集相机。
  camera_start_timeout_s: 15
  camera_shutdown_timeout_s: 5
  # 瞬时空包/损坏帧只丢当前帧；持续无有效画面超过该时间才停止整个 episode。
  camera_failure_timeout_ms: 2500
  camera_retry_delay_ms: 10
  camera_error_report_interval: 30
  # 任一路相机低于这些质量门限时自动丢弃 episode，避免把卡顿视频用于训练。
  min_camera_fps: 24
  min_camera_unique_ratio: 0.70
  max_camera_error_ratio: 0.10
  reject_low_quality_episode: true
robot:
  enabled: true
  hand_dof: 7
  # 必须先在终端显式执行 home 并成功，之后才允许 start episode。
  require_home_before_start: true
  worker_stop_timeout_s: 3
  state_stop_timeout_s: 3
  left:
    interface: "socketcan"
    channel: "can_left"
    bitrate: 1000000
    speed_percent: 20
    hand_port: "/dev/ttyACM1"
    enable_timeout_s: 5
    health_timeout_s: 3
    # move_p 无同步返回值，每秒读取一次控制器状态判断无解/越限/刹车等错误。
    arm_status_poll_interval_s: 1
    # 请在真机标定并确认无碰撞后填写6维关节角；start 会先用 move_j 到此位置。
    # 未配置 home_pose 时，home/start 都会安全拒绝，不会执行运动。
    home_pose: [0, 0.45, -0.45, 0,0,0]
    home_speed_percent: 10
    home_timeout_s: 10
    home_joint_tolerance_rad: 0.10
    hand_home_wait_s: 8
    vive_scale: 0.5
    initial_pose: [0, 0, 0, 0,0,0]
    # start 时锁定真实法兰姿态，episode 内仅由 VIVE 控制位置，避免首帧姿态跳变。
    orientation_mode: "current_on_start"
    # 仅当 orientation_mode=configured_fixed 时使用。
    fixed_orientation: [0.0698, 1.3963,0]
    workspace_min: [0.05, 0.00, 0.05]
    workspace_max: [0.40, 0.35, 0.45]
    max_linear_step_m: 0.01
  right:
    # linux :socketcan can1; windows:agx_cando, 1
    interface: "socketcan"
    channel: "can_right"
    bitrate: 1000000
    speed_percent: 20
    hand_port: "/dev/ttyACM0"
    enable_timeout_s: 5
    health_timeout_s: 3
    arm_status_poll_interval_s: 1
    # 右臂 home_pose 必须单独标定，不能照抄左臂；尤其要检查双臂回零轨迹。
    home_pose: [0, 0.45, -0.45, 0,0,0]
    home_speed_percent: 10
    home_timeout_s: 10
    home_joint_tolerance_rad: 0.10
    hand_home_wait_s: 8
    vive_scale: 0.5
    initial_pose: [0, 0, 0, 0,0,0]
    orientation_mode: "current_on_start"
    # 仅当 orientation_mode=configured_fixed 时使用。
    fixed_orientation: [-1.3963,1.5184,-1.3614]
    workspace_min: [0.05, -0.35, 0.05]
    workspace_max: [0.40, 0.00, 0.45]
    max_linear_step_m: 0.01
  hand_min: [0, 0, 0, 0, 0, 0, 0]
  hand_max: [100, 100, 90, 90, 90, 90, 90]
cameras:
  width: 640
  height: 480
  wrist_left:
    driver: "opencv"
    # 真机实测节点；正式部署建议替换为 /dev/v4l/by-id/... 稳定路径。
    device: "/dev/video6"
    # 三路相机错峰连接，避免 USB/V4L2/RealSense 同时初始化。
    startup_delay_ms: 0
    backend: "v4l2"
    fourcc: "MJPG"
    fps: 30
    buffer_size: 1
    strict_fourcc: true
    strict_resolution: true
    fps_tolerance: 2.0
    opencv_threads: 1
    # 部分 V4L2 backend 不接受以下超时属性；recorder 另有共享帧停滞 watchdog。
    open_timeout_ms: 5000
    read_timeout_ms: 2000
    failure_timeout_ms: 2500
  wrist_right:
    driver: "opencv"
    device: "/dev/video8"
    startup_delay_ms: 300
    backend: "v4l2"
    fourcc: "MJPG"
    fps: 30
    buffer_size: 1
    strict_fourcc: true
    strict_resolution: true
    fps_tolerance: 2.0
    opencv_threads: 1
    open_timeout_ms: 5000
    read_timeout_ms: 2000
    failure_timeout_ms: 2500
  scene:
    driver: "realsense"
    # 最后启动 RealSense，避免三路 USB 相机在同一时刻初始化。
    startup_delay_ms: 600
    # 只有连接多台RealSense时才需要填写序列号；单台时可以留空。
    serial: ""
    fps: 30
    timeout_ms: 1000
    warmup_frames: 10
dataset:
  writer: "lerobot_v3"
  repo_id: "local/dual_piper_aerohand"
  root: "./dataset/dual_piper_aerohand"
  task: "Bimanual Piper and Aerohand teleoperation"
  # 允许 Writer 短时抖动约 8 秒；满时仍丢新帧并在 episode 诊断中报告。
  queue_capacity: 256
  # 新版 LeRobot 直接流式编码 MP4；0.4 版本会自动回退为临时 PNG -> stop 时编码 MP4。
  streaming_encoding: true
  encoder_queue_maxsize: 90
  # 三路视频各自编码；限制每路线程数，避免3个SVT-AV1编码器过度抢占控制进程CPU。
  encoder_threads: 2
  image_writer_processes: 2
  image_writer_threads: 2
