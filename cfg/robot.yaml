# 设备 B：双 Piper、双 Aerohand、双腕相机及全景相机。
network:
  data_port: 17860
  max_packet_bytes: 65507
rates:
  control_hz: 100
  state_hz: 100
  camera_hz: 30
  frame_hz: 30
alignment:
  max_lag_ms: 80
  teleop_timeout_ms: 150
  buffer_capacity: 512
runtime:
  # 固定使用 spawn，避免 Linux fork 继承 CAN、串口、USB 和 UDP 的内部状态。
  process_model: "spawn"
  # IPC 只传递遥操作、机器人状态和动作等小对象，绝不传图像。
  ipc_queue_capacity: 2048
  status_queue_capacity: 128
  shutdown_timeout_s: 8
  writer_shutdown_timeout_s: 15
robot:
  enabled: true
  hand_dof: 7
  left:
    interface: "socketcan"
    channel: "can_left"
    bitrate: 1000000
    speed_percent: 20
    hand_port: "/dev/ttyACM1"
    home_on_connect: false
    vive_scale: 0.3
    initial_pose: [0, 0, 0, 0 , 0.2201, -1.6187]
    fixed_orientation: [-1.8968, 0.2201, -1.6187]
    workspace_min: [0.05, 0.00, 0.05]
    workspace_max: [0.40, 0.35, 0.45]
    max_linear_step_m: 0.01
  right:
    # linux :socketcan can1; windows:agx_cando, 1
    interface: "socketcan"
    channel: "can_right"
    bitrate: 1000000
    speed_percent: 20
    hand_port: "/dev/ttyACM0"
    home_on_connect: false
    vive_scale: 0.3
    initial_pose: [0, 0, 0, 0, 0.2201, -1.6187]
    fixed_orientation: [-1.8968, 0.2201, -1.6187]
    workspace_min: [0.05, -0.35, 0.05]
    workspace_max: [0.40, 0.00, 0.45]
    max_linear_step_m: 0.01
  hand_min: [0, 0, 0, 0, 0, 0, 0]
  hand_max: [100, 100, 90, 90, 90, 90, 90]
cameras:
  width: 640
  height: 480
  wrist_left:
    cam_num: 0
    format_idx: 1
  wrist_right:
    cam_num: 1
    format_idx: 1
  scene:
    driver: "realsense"
    # 只有连接多台RealSense时才需要填写序列号；单台时可以留空。
    serial: ""
    fps: 30
    timeout_ms: 1000
    warmup_frames: 10
dataset:
  writer: "lerobot_v3"
  repo_id: "local/dual_piper_aerohand"
  root: "./dataset/dual_piper_aerohand"
  task: "Bimanual Piper and Aerohand teleoperation"
  queue_capacity: 64
