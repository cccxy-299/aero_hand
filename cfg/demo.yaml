network:
  transport: "zmq"
  robot_host: "127.0.0.1"
  data_port: 17860
  sync_port: 17862
  max_packet_bytes: 65507
  startup_timeout_s: 5
rates:
  operator_hz: 60
  control_hz: 100
  state_hz: 100
  camera_hz: 30
  frame_hz: 30
alignment:
  max_lag_ms: 80
  teleop_timeout_ms: 150
  buffer_capacity: 512
robot:
  enabled: false
  hand_dof: 7
  left:
    initial_pose: [0.25, 0.16, 0.25, 0.0, 0.0, 0.0]
    fixed_orientation: [0.0, 0.0, 0.0]
    workspace_min: [0.05, 0.00, 0.05]
    workspace_max: [0.40, 0.35, 0.45]
    max_linear_step_m: 0.01
  right:
    initial_pose: [0.25, -0.16, 0.25, 0.0, 0.0, 0.0]
    fixed_orientation: [0.0, 0.0, 0.0]
    workspace_min: [0.05, -0.35, 0.05]
    workspace_max: [0.40, 0.00, 0.45]
    max_linear_step_m: 0.01
  hand_min: [0, 0, 0, 0, 0, 0, 0]
  hand_max: [100, 100, 90, 90, 90, 90, 90]
cameras:
  width: 320
  height: 240
dataset:
  writer: "debug_jsonl"
  repo_id: "local/dual_piper_aerohand_demo"
  root: "./output/piper_aerohand_demo"
  task: "Bimanual teleoperation simulation"
  queue_capacity: 64
